<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contador Multiteléfono</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .fullscreen-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 1000;
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  .menu {
    display: flex;
    gap: 16px;
  }

  button.main {
    font-size: 22px;
    padding: 18px 30px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }

  .screen {
    display: none;
    width: 100%;
    height: 100vh;
  }

  .active { display: flex; }

  #computerScreen {
    background: linear-gradient(135deg, #003cff, #00aaff);
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }

  #money {
    font-size: 72px;
    font-weight: bold;
    text-shadow: 0 0 18px rgba(255,255,255,.7);
  }

  #hint {
    margin-top: 20px;
    font-size: 18px;
  }

  #phoneScreen {
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: #000;
  }

  #connectBtn, #stopBtn {
    background: red;
    color: white;
    display: none;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    font-weight: bold;
  }

  #phoneId {
    position: fixed;
    bottom: 12px;
    font-size: 14px;
    opacity: .8;
  }
</style>
</head>
<body>

<button class="fullscreen-btn" onclick="toggleFullScreen()">Pantalla completa</button>

<div id="menu" class="menu">
  <button class="main" onclick="openComputer()">Para computadora</button>
  <button class="main" onclick="openPhone()">Para teléfono</button>
</div>

<div id="computerScreen" class="screen">
  <div id="money">$0</div>
  <div id="hint">Presiona ENTER para iniciar</div>
</div>

<div id="phoneScreen" class="screen">
  <button id="connectBtn">Conectar teléfono</button>
  <button id="stopBtn">DETENER</button>
  <div id="phoneId"></div>
</div>

<script>
const channel = new BroadcastChannel('contador_multitelefono');
const phoneId = Math.random().toString(36).slice(2, 9);
let connected = false;
let counting = false;
let stopped = false;
let amount = 0;
let interval = null;

const money = document.getElementById('money');
const phoneScreen = document.getElementById('phoneScreen');
const stopBtn = document.getElementById('stopBtn');
document.getElementById('phoneId').textContent = 'ID: ' + phoneId;

function openComputer() {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('computerScreen').classList.add('active');
}

function openPhone() {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('phoneScreen').classList.add('active');
  document.getElementById('connectBtn').style.display = 'block';
}

function formatMoney(n) {
  return '$' + n.toLocaleString('es-MX');
}

function startCounter() {
  if (counting) return;

  stopped = false;
  amount = 0;
  money.textContent = '$0';
  counting = true;

  channel.postMessage({ type: 'start' });

  interval = setInterval(() => {
    amount += Math.floor(Math.random() * 1500) + 400;

    if (amount >= 1000000) {
      amount = 1000000;
      money.textContent = formatMoney(amount);
      clearInterval(interval);

      setTimeout(() => {
        if (!stopped) {
          channel.postMessage({ type: 'allGreen' });
        }
        amount = 0;
        money.textContent = '$0';
        counting = false;
      }, 10000);

      return;
    }

    money.textContent = formatMoney(amount);
  }, 150);
}

window.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('computerScreen').classList.contains('active')) {
    startCounter();
  }
});

channel.onmessage = (event) => {
  const msg = event.data;

  if (msg.type === 'start' && connected) {
    phoneScreen.style.background = '#000';
  }

  if (msg.type === 'connected') {
    // solo referencia de conexión
  }

  if (msg.type === 'stop' && counting && !stopped) {
    stopped = true;
    counting = false;
    clearInterval(interval);
    channel.postMessage({ type: 'winner', winner: msg.phoneId });
  }

  if (msg.type === 'winner') {
    if (msg.winner === phoneId) {
      phoneScreen.style.background = 'green';
    } else {
      phoneScreen.style.background = 'red';
    }
  }

  if (msg.type === 'allGreen') {
    phoneScreen.style.background = 'green';
  }
};

document.getElementById('connectBtn').onclick = () => {
  connected = true;
  document.getElementById('connectBtn').style.display = 'none';
  stopBtn.style.display = 'block';
  channel.postMessage({ type: 'connected', phoneId });
};

stopBtn.onclick = () => {
  if (!connected) return;
  channel.postMessage({ type: 'stop', phoneId });
};

function toggleFullScreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}
</script>

</body>
</html>
